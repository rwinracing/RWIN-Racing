.start-day{display:flex;flex-wrap:wrap;gap:4px 8px}.start-day b{min-width:100px;color:var(--muted);font-weight:600}
#profile .btn{color:#160e19;text-decoration:none}.roster img.driver-avatar{width:78px;height:78px;border-radius:6px}
.race-facts div:has(.start-day),.race-facts div:has(.class-chip){grid-column:1/-1}
@media(max-width:620px){.driver-card{min-height:0;gap:16px}}
@media(max-width:520px){.profile-head{flex-direction:column;align-items:flex-start;padding:24px 20px}.profile-body{padding:20px}}
.countdown{color:var(--white);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.08em;margin-left:2px}
.signups{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}
.signups-label{font:700 10.5px/1 var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--purple)}
.signups-faces{display:flex;padding-left:8px}.signups-faces>*{display:grid;place-items:center;width:36px;height:36px;margin-left:-8px;border-radius:50%;object-fit:cover;border:2px solid var(--surface);background:var(--surface-alt);color:var(--purple);font:italic 800 16px var(--font-display);box-shadow:0 0 0 1px var(--purple-dark)}
.signups-faces .signups-more{color:var(--white);font:700 11px var(--font-ui);background:#2a1e30}
.soon-page{text-align:left}.soon{font:italic 800 clamp(110px,22vw,300px)/.85 var(--font-display);letter-spacing:-.04em;margin:30px 0 18px;background:linear-gradient(100deg,var(--purple) 0%,#f3d7f8 45%,var(--purple) 70%);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:soonShine 5s linear infinite}
@keyframes soonShine{to{background-position:-200% 0}}@media(prefers-reduced-motion:reduce){.soon{animation:none}}
#signup{width:min(760px,96vw);max-height:92dvh;padding:0;overflow:auto;background:#141018}#signup::backdrop{background:#08070ce8}
#signup .close{position:absolute;right:16px;top:18px;width:40px;height:40px;float:none;background:var(--surface-alt)}
#signupTitle{font:italic 800 clamp(30px,5vw,46px)/1 var(--font-display);text-transform:uppercase;margin:8px 0 0}.signup-sub{margin:8px 0 0;color:var(--muted);font-size:14px}
#signup h3{font:700 13px var(--font-ui);letter-spacing:.1em;text-transform:uppercase;color:#d8c8dc;margin:6px 0 10px}
.pick-row{display:flex;flex-wrap:wrap;gap:8px}.pick{min-width:64px;min-height:40px;padding:8px 14px;border:1px solid var(--line);border-radius:3px;background:var(--surface-alt);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.pick:hover{border-color:var(--purple-dark);color:var(--white)}.pick[aria-pressed=true]{background:var(--purple);border-color:var(--purple);color:var(--background)}
.slot-grid{display:grid;gap:10px;margin-top:12px}.slot-row{display:grid;grid-template-columns:190px 1fr;gap:12px;align-items:center;padding:12px;border:1px solid #453347;background:#17131b}
.slot-day{display:flex;flex-direction:column;align-items:flex-start;gap:6px}.slot-day b{font-weight:600}.slot-day b::first-letter{text-transform:uppercase}.slot-all{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--purple)}.slot-all[aria-pressed=true]{color:var(--muted)}
.signup-notes{display:grid;gap:6px;margin-top:20px}.signup-notes span{font:700 13px var(--font-ui);letter-spacing:.1em;text-transform:uppercase;color:#d8c8dc}
.signup-notes textarea{font:inherit;color:var(--white);background:var(--surface-alt);border:1px solid var(--line);border-radius:3px;padding:10px 12px;resize:vertical}.signup-notes textarea:focus{outline:none;border-color:var(--purple)}.signup-notes small{color:var(--dimmed);justify-self:end}
.signup-msg{margin:14px 0 0;padding:10px 12px;border:1px solid #7a3340;background:#2a1519;color:#ffb3bb}
.signup-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}.btn.danger{border-color:#7a3340;color:#ff9aa4}.btn.danger:hover{background:#2a1519;color:#ffb3bb}
.btn[disabled]{opacity:.6;cursor:wait}
.entry-card .entry-pick{margin-top:8px;font-size:14px;color:#cdc7d0;line-height:1.7}.entry-card .entry-pick b{color:var(--white);font-weight:600}.entry-actions{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.race-content>.signups{margin:0 0 16px;padding:14px 0 0}
.fov{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(160px,1fr);gap:12px;align-items:end;padding:16px;border:1px solid #453347;background:var(--surface-alt);border-radius:3px}
.fov label{display:grid;gap:6px;font-size:12px;color:var(--muted)}.fov input,.fov select{font:inherit;font-size:15px;color:var(--white);background:var(--surface);border:1px solid var(--line);border-radius:3px;height:42px;padding:0 10px}.fov input:focus,.fov select:focus{outline:none;border-color:var(--purple)}
.fov-out{display:grid;gap:2px;justify-items:end}.fov-out span{font-size:12px;color:var(--muted)}.fov-out b{font:italic 800 44px/1 var(--font-display);color:var(--purple)}
@media(max-width:900px){.fov{grid-template-columns:1fr 1fr}.fov-out{justify-items:start}}
@media(max-width:620px){.slot-row{grid-template-columns:1fr}.slot-day{flex-direction:row;justify-content:space-between;align-items:center}.entry-actions{flex-direction:row;width:100%;justify-content:flex-start}}
#guide{width:min(1120px,96vw);max-width:none;max-height:94dvh;padding:0;overflow:auto;background:var(--background);border:1px solid var(--line);border-top:3px solid var(--purple)}#guide::backdrop{background:#08070cee}
#guide .close{position:absolute;right:16px;top:16px;z-index:3;width:40px;height:40px;float:none;padding:0;background:#120d16cc;border-color:#ffffff30;color:#fff}
.gd{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,.7fr);min-height:min(720px,88dvh)}
.gd-main{display:flex;flex-direction:column;padding:clamp(22px,3.6vw,46px)}
.gd-sectors{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:28px}
.gd-sector{display:grid;gap:7px;padding:0;text-align:left;font:700 10px/1 var(--font-ui);letter-spacing:.16em;color:var(--dimmed)}
.gd-sector i{display:block;height:7px;background:var(--line-soft);transform:skewX(-24deg);transition:background .3s,box-shadow .3s}
.gd-sector.done{color:var(--purple)}.gd-sector.done i{background:var(--purple)}.gd-sector.cur{color:var(--white)}.gd-sector.cur i{background:var(--white);box-shadow:0 0 14px #ffffff55}
.gd-sector:disabled{cursor:default}.gd-sector:not(:disabled):hover i{box-shadow:0 0 0 1px var(--purple)}
.gd-kicker{display:flex;justify-content:space-between;gap:10px;font:600 11px/1.4 var(--font-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--purple)}.gd-kicker span+span{color:var(--muted)}
#guideTitle{font:italic 800 clamp(46px,6.2vw,84px)/.9 var(--font-display);letter-spacing:-.03em;text-transform:uppercase;margin:14px 0 16px;outline:none}
.gd-lead{max-width:58ch;margin:0 0 24px;color:#c7c1cc}.gd-body{flex:1}
.gd-stats{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:20px;border:1px solid var(--line);background:var(--surface)}.gd-stats div{padding:16px 18px}.gd-stats div+div{border-left:1px solid var(--line)}
.gd-stats b{display:block;font:italic 800 40px/1 var(--font-display);color:var(--purple)}.gd-stats span{display:block;margin-top:6px;font-size:13px;color:var(--muted)}
.gd-checks{display:grid;gap:11px;margin:0;padding:0;list-style:none}.gd-checks li{display:grid;grid-template-columns:20px 1fr;column-gap:8px}
.gd-checks li:before{content:"";width:12px;height:12px;margin-top:5px;background:linear-gradient(135deg,var(--purple) 50%,transparent 50%);border:1px solid var(--purple)}
.gd-checks b{font-weight:600}.gd-checks span{grid-column:2;font-size:13.5px;color:var(--muted)}
.gd-template{margin-bottom:18px;padding:16px 18px;border-left:3px solid var(--purple);background:var(--surface)}.gd-template span{font:600 10px var(--font-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--purple)}.gd-template p{margin:8px 0 0;font-size:15px}.gd-template b{color:var(--purple)}
.gd-split{display:grid;grid-template-columns:1fr 1fr;gap:14px}.gd-split>div{padding:18px;border:1px solid var(--line);background:var(--surface)}
.gd-split h3,.gd-h3{margin:0 0 14px;font:700 11px/1.3 var(--font-ui);letter-spacing:.16em;text-transform:uppercase;color:#d8c8dc}.gd-h3{margin:22px 0 12px}
.gd-keys{display:flex;flex-wrap:wrap;gap:8px}.gd-keys kbd{padding:7px 11px;border:1px solid var(--line);border-bottom-width:3px;border-radius:4px;background:var(--surface);color:var(--white);font:600 12.5px var(--font-ui)}
.gd-lights{display:flex;gap:14px;margin:4px 0 26px}.gd-lights i{width:46px;height:46px;border-radius:50%;background:#2a1d2d;box-shadow:inset 0 0 0 3px #3a2a3e}
@keyframes gdL0{0%,6%{background:#2a1d2d;box-shadow:inset 0 0 0 3px #3a2a3e}7%,62%{background:#ff3046;box-shadow:0 0 20px #ff304699,inset 0 0 0 3px #ff8a95}63%,100%{background:#2a1d2d;box-shadow:inset 0 0 0 3px #3a2a3e}}.gd-lights i:nth-child(1){animation:gdL0 4.5s infinite}@keyframes gdL1{0%,14%{background:#2a1d2d;box-shadow:inset 0 0 0 3px #3a2a3e}15%,62%{background:#ff3046;box-shadow:0 0 20px #ff304699,inset 0 0 0 3px #ff8a95}63%,100%{background:#2a1d2d;box-shadow:inset 0 0 0 3px #3a2a3e}}.gd-lights i:nth-child(2){animation:gdL1 4.5s infinite}@keyframes gdL2{0%,22%{background:#2a1d2d;box-shadow:inset 0 0 0 3px #3a2a3e}23%,62%{background:#ff3046;box-shadow:0 0 20px #ff304699,inset 0 0 0 3px #ff8a95}63%,100%{background:#2a1d2d;box-shadow:inset 0 0 0 3px #3a2a3e}}.gd-lights i:nth-child(3){animation:gdL2 4.5s infinite}@keyframes gdL3{0%,30%{background:#2a1d2d;box-shadow:inset 0 0 0 3px #3a2a3e}31%,62%{background:#ff3046;box-shadow:0 0 20px #ff304699,inset 0 0 0 3px #ff8a95}63%,100%{background:#2a1d2d;box-shadow:inset 0 0 0 3px #3a2a3e}}.gd-lights i:nth-child(4){animation:gdL3 4.5s infinite}@keyframes gdL4{0%,38%{background:#2a1d2d;box-shadow:inset 0 0 0 3px #3a2a3e}39%,62%{background:#ff3046;box-shadow:0 0 20px #ff304699,inset 0 0 0 3px #ff8a95}63%,100%{background:#2a1d2d;box-shadow:inset 0 0 0 3px #3a2a3e}}.gd-lights i:nth-child(5){animation:gdL4 4.5s infinite}
@media(prefers-reduced-motion:reduce){.gd-lights i{animation:none!important}}
.gd-go{min-height:54px;padding:12px 30px;font-size:16px}.gd-done{color:var(--purple);font-weight:700}
.gd-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:30px;padding-top:18px;border-top:1px solid var(--line)}.gd-foot-r{display:flex;align-items:center;gap:18px}
.gd-poster{position:relative;isolation:isolate;overflow:hidden;display:grid;place-items:center;color:#171019;background:linear-gradient(125deg,transparent 0 59%,#df9be466 59% 67%,transparent 67%),repeating-linear-gradient(126deg,transparent 0 29px,#341c4015 30px 31px,transparent 32px 47px),radial-gradient(ellipse at 72% 25%,#e4a2e9,transparent 70%),linear-gradient(125deg,#a965bc,#d28adc 62%,#b272c1)}
.gd-poster .crop{position:absolute;inset:16px;border:1px solid #38163e44;pointer-events:none}
.gd-poster-top,.gd-poster-bottom{position:absolute;left:8%;right:8%;display:flex;justify-content:space-between;align-items:center;font:700 10px/1.2 var(--font-ui);letter-spacing:.13em}.gd-poster-top{top:7%}.gd-poster-bottom{bottom:7%}
.gd-num{position:absolute;top:12%;left:8%;font:italic 800 clamp(96px,12vw,180px)/.8 var(--font-display);color:transparent;-webkit-text-stroke:2px #17101980}
.gd-mark{width:74%;height:46%;margin-top:22%;color:#100e12;transform:rotate(-5deg)}
@media(max-width:780px){.gd{grid-template-columns:1fr}.gd-poster{order:-1;min-height:150px}.gd-num{top:auto;bottom:16%;font-size:84px}.gd-mark{width:38%;height:62%;margin:0 0 0 38%}.gd-poster-bottom{display:none}.gd-poster-top span:last-child{display:none}.gd-split{grid-template-columns:1fr}.gd-stats b{font-size:30px}.gd-stats div{padding:12px}}

function loadImage(base,onload,alt=''){
 const exts=/\.[a-z]{3,4}$/i.test(base)?['']:['.png','.jpg','.jpeg','.webp'];
 const img=new Image(); img.alt=alt; let i=0;
 img.onload=()=>onload(img); img.onerror=()=>{if(++i<exts.length)img.src=base+exts[i]};
 img.src=base+exts[0];
}

// LOGOS — opcjonalne ścieżki do oryginalnych plików PNG z przezroczystym tłem.

// Dla grafiki 500 × 500 przycinamy tylko przezroczyste marginesy w SVG.

const LOGOS = { header: '', hero: '', footer: '' };

function applyLogos(){

  const locations = {header: '.bar .identity svg', hero: '.mainmark', footer: '.foot .identity svg'};

  for (const [place, selector] of Object.entries(locations)) {

    const svg = document.querySelector(selector);

    if (!svg || !LOGOS[place]) continue;

    const probe = new Image();

    probe.onload = () => {

      svg.setAttribute('viewBox', '92 165 276 162');

      const image = document.createElementNS('http://www.w3.org/2000/svg', 'image');

      image.setAttribute('href', LOGOS[place]);

      image.setAttribute('width', '500');

      image.setAttribute('height', '500');

      svg.replaceChildren(image);

    };

    probe.src = LOGOS[place];

  }

}

function times(e){return [...e.sessions].sort((a,b)=>Date.parse(a)-Date.parse(b))}

function nextStart(now=Date.now()){

  let result=null;

  for(const event of EVENTS){

    for(const session of event.sessions){

      const at=Date.parse(session);

      if(at>now && (!result || at<result.at)) result={event,session,at};

    }

  }

  return result;

}

function card(e,session){

 const start=session?dateKey(new Date(session)):e.start;

 const sameMonth=start.slice(0,7)===e.end.slice(0,7);

 const days=start.slice(-2)+(sameMonth&&!session&&start!==e.end?'–'+e.end.slice(-2):'');

 return `<article class="racecard"><div class="date">${days}<small>${fmt(start,{month:'short',year:'numeric'}).toUpperCase()}</small></div>

 <div class="raceinfo"><span class="tag">${categories()[e.category]}</span><h3>${label(e.name)}</h3><div class="meta">${label(eventTrack(e).name)} · ${escapeHTML(e.duration)}${classList(e).length?' · '+escapeHTML(classList(e).join(' / ')):''}</div>

 <div class="note">${!sameMonth?range(e)+' · ':''}${session?sessionTime(session):times(e).length?t('Pierwsza sesja','First session')+' · '+full(dateKey(new Date(times(e)[0])))+' · '+sessionTime(times(e)[0]):t('Godziny sesji do potwierdzenia','Session times to be confirmed')}</div></div>

 <button class="btn outline" data-event="${escapeHTML(e.id)}" aria-label="${t('Szczegóły','Details')} · ${label(e.name)}">${t('Szczegóły','Details')} <span aria-hidden="true">↗</span></button></article>`;

}

// Zapisani na event (lewy dolny róg banera). Pokaże się, gdy event będzie miał listę signups: [{name, avatar}].
function signupsStrip(e){
 const list=Array.isArray(e.signups)?e.signups.filter(p=>p&&p.name):[];

 const shown=list.slice(0,8);
 return `<div class="signups"><span class="signups-label">${t('Zapisani','Signed up')} · ${list.length}</span><div class="signups-faces">${shown.map(p=>{
   const name=String(p.name);

 }).join('')}${list.length>shown.length?`<span class="signups-more">+${list.length-shown.length}</span>`:''}</div></div>`;

function countdownText(at){
 const left=Math.max(0,Math.floor((at-Date.now())/1000)), d=Math.floor(left/86400), z=n=>String(n).padStart(2,'0');
 const clock=z(Math.floor(left%86400/3600))+':'+z(Math.floor(left%3600/60))+':'+z(left%60);
 return d?d+' '+t(d===1?'dzień':'dni','d')+' '+clock:clock;
}

setInterval(()=>{const c=document.querySelector('.countdown[data-at]');if(c)c.textContent=countdownText(Number(c.dataset.at))},1000);

function renderNext(){

 clearTimeout(nextTimer);

 const block=$('#nextEvent');

 if(!block)return;

 const next=nextStart();

 const track=next?eventTrack(next.event):TRACKS.silverstone;

 const name=label(track.name);

 block.innerHTML=`<div class="event-copy"><div class="kicker">${next?`${t('Następny event za','Next event in')} <b class="countdown" data-at="${next.at}">${countdownText(next.at)}</b>`:t('Następny event','Next event')}</div>

 <h2 id="nextHeading">${next?label(next.event.name):t('Czekamy na kolejny termin','Waiting for the next start')}</h2>

 ${next?`<div class="meta">${name} · ${categories()[next.event.category]}</div><time class="session-date" datetime="${escapeHTML(next.session)}">${full(dateKey(new Date(next.at)))}</time>

 <button class="btn" data-event="${escapeHTML(next.event.id)}">${t('Szczegóły','Details')} ↗</button> <a class="smalllink" href="#calendar">${t('Kalendarz','Calendar')} →</a>${signupsStrip(next.event)}`:

 <figure class="event-photo is-fallback"><figcaption>${name}</figcaption></figure>`;

 const figure=block.querySelector('figure');

   loadImage(track.photo,img=>{

     if(!figure.isConnected)return;

     figure.classList.remove('is-fallback');figure.prepend(img);

     if(track.credit)figure.querySelector('figcaption').innerHTML+=` · <a href="${escapeHTML(track.source)}">${escapeHTML(track.credit)}</a>`;

   },local(track.name));

 }

 if(next)nextTimer=setTimeout(renderNext,Math.min(next.at-Date.now(),2147483647));

}

function calendar(){

 const first=asDate(month+'-01');

 const offset=(first.getUTCDay()+6)%7;

 const last=new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth()+1,0)).getUTCDate();

 const all=EVENTS.filter(e=>e.start<=month+'-'+last&&e.end>=month+'-01').sort((a,b)=>a.start.localeCompare(b.start));

 const shown=all.filter(e=>filter==='all'||filter===e.category);

 const weekdays=Array.from({length:7},(_,i)=>`<div class="weekday">${fmt('2026-11-'+(16+i),{weekday:'short'})}</div>`).join('');

 let cells='<div class="blank"></div>'.repeat(offset);

 for(let day=1;day<=last;day++){

   const key=month+'-'+String(day).padStart(2,'0');

   const marks=shown.filter(e=>e.start<=key&&e.end>=key).map(e=>`<button data-event="${escapeHTML(e.id)}" aria-label="${label(e.name)} · ${full(key)}">${label(e.name)}</button>`).join('');

   cells+=`<div class="day ${key===today()?'today':''}"><span class="num" ${key===today()?'aria-current="date"':''}>${day}</span>${marks}</div>`;

 }

 cells+='<div class="blank"></div>'.repeat((7-(offset+last)%7)%7);

 return `<section class="page"><div class="kicker">Le Mans Ultimate</div><h1>${t('Kalendarz wyścigów','Race calendar')}</h1>

 <div class="tools"><h2>${fmt(month+'-01',{month:'long',year:'numeric'})}</h2><button data-month="-1" aria-label="${t('Poprzedni miesiąc','Previous month')}">←</button><button data-month="0">${t('Dzisiaj','Today')}</button><button data-month="1" aria-label="${t('Następny miesiąc','Next month')}">→</button></div>

 <div class="chips">${Object.entries(categories()).map(([k,v])=>`<button aria-pressed="${filter===k}" data-filter="${k}">${v}</button>`).join('')}</div>

 <div class="grid">${weekdays+cells}</div><h2 class="calList">${t('Wyścigi w tym miesiącu','This month’s races')}</h2>

 ${shown.length?shown.map(e=>card(e)).join(''):`<p class="panel">${all.length?t('Brak wydarzeń w wybranej kategorii.','No events in this category.'):t('Brak potwierdzonych wydarzeń w tym miesiącu','No confirmed events this month')}</p>`}

 <p class="note">${t('Terminarz aktualizowany ręcznie. Źródło i datę sprawdzenia znajdziesz w szczegółach wydarzenia.','Manually updated schedule. Each event includes its source and verification date.')}</p></section>`;

}

function startTimes(slots){
 const clock=new Intl.DateTimeFormat(locale(),{timeZone:zone,hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
 const groups=new Map();
 for(const s of slots){const k=dateKey(new Date(s));if(!groups.has(k))groups.set(k,[]);groups.get(k).push(clock.format(new Date(s)))}
 const tz=sessionTime(slots[0]).split(' ').pop();
 return `<ul>${[...groups].map(([k,times])=>`<li class="start-day"><b>${fmt(k,{weekday:'short',day:'numeric',month:'short'})}</b><span>${times.join(' · ')}</span></li>`).join('')}</ul><small class="race-note">${t('Czas polski','Polish time')} (${escapeHTML(tz)})</small>`;
}

function loadSDK() {

   pick=`<h3>${t('Kiedy możesz jechać?','When can you race?')}</h3><p class="race-note">${t('Zaznacz godziny startów, w które możesz. „Cały dzień” zaznacza wszystkie starty danego dnia.','Select the start times you can make. “All day” selects every start that day.')}</p>
   <div class="slot-grid">${[...groupSlots(sessions)].map(([k,v])=>{const all=v.every(x=>d.slots.has(x.iso));
     return `<div class="slot-row"><div class="slot-day"><b>${fmt(k,{weekday:'long',day:'numeric',month:'short'})}</b><button class="slot-all" data-slot-day="${k}" aria-pressed="${all}">${all?t('Odznacz dzień','Clear day'):t('Cały dzień','All day')}</button></div>
     <div class="pick-row">${v.map(x=>`<button class="pick" data-slot="${escapeHTML(x.iso)}" aria-pressed="${d.slots.has(x.iso)}">${x.time}</button>`).join('')}</div></div>`}).join('')}</div>`;
 }else{
   pick=`<h3>${t('W które dni możesz?','Which days can you make?')}</h3><p class="race-note">${t('Godziny startów zostaną ogłoszone. Zaznacz dni, w które możesz jechać.','Start times will be announced. Select the days you can race.')}</p>
   <div class="pick-row">${eventDays(e).map(k=>`<button class="pick" data-pick-day="${k}" aria-pressed="${d.days.has(k)}">${fmt(k,{weekday:'short',day:'numeric',month:'short'})}</button>`).join('')}</div>`;
 }
 const notes=training?'':`<label class="signup-notes"><span>${t('Uwagi (opcjonalnie)','Notes (optional)')}</span><textarea id="signupNotes" maxlength="500" rows="3" placeholder="${t('np. mogę max 2 stinty, wolę jechać nocą','e.g. max 2 stints, prefer night')}">${escapeHTML(d.notes)}</textarea><small id="notesCount">${d.notes.length} / 500</small></label>`;
 $('#signupBody').innerHTML=`<div class="race-head"><small>RWIN Racing / ${t('Zapis na event','Event sign-up')}</small><h2 id="signupTitle">${label(e.name)}</h2>
 <p class="signup-sub">${label(eventTrack(e).name)} · ${range(e)}${classList(e).length&&!training?' · '+escapeHTML(classList(e).join(' / ')):''}</p></div>
 <div class="race-content">${pick}${notes}
 ${d.msg?`<p class="signup-msg" role="alert">${escapeHTML(d.msg)}</p>`:''}
 <div class="signup-actions"><button class="btn" data-signup-save ${d.busy?'disabled':''}>${d.busy?t('Zapisuję…','Saving…'):d.mine?t('Zapisz zmiany','Save changes'):t('Zapisz się','Sign up')}</button>
 ${d.mine?`<button class="btn outline danger" data-signup-leave ${d.busy?'disabled':''}>${d.armed?t('Na pewno wypisać?','Really leave?'):t('Wypisz się','Leave')}</button>`:''}</div></div>`;
 $('#signup .close').setAttribute('aria-label',t('Zamknij','Close'));
 if(focusSel)$('#signup').querySelector(focusSel)?.focus();
}

async function saveSignup(){
 const d=signupDraft, e=EVENTS.find(x=>x.id===d.id);if(!e||d.busy)return;
 const training=e.category==='training';
 if(training&&!d.cls){d.msg=t('Wybierz klasę.','Choose a class.');return paintSignup()}
 const slots=[...d.slots].filter(s=>(e.sessions||[]).includes(s));
 const days=(e.sessions||[]).length?[...new Set(slots.map(s=>dateKey(new Date(s))))]:[...d.days];
 if(!training&&!slots.length&&!days.length){d.msg=t('Zaznacz przynajmniej jeden termin.','Select at least one option.');return paintSignup()}
 d.busy=true;d.msg='';paintSignup();
 try{
   await rpc('signup',{p_event:d.id,p_slots:training?[]:slots,p_days:training?[]:days,p_class:training?d.cls:null,p_notes:training?'':d.notes});
   mySignupsState='idle';await loadMySignups();syncPublic();
   if($('#signup').open)$('#signup').close();
   showToast(d.mine?t('Zapisano zmiany.','Changes saved.'):t('Jesteś zapisany! 🏁','You are signed up! 🏁'));
 }catch(err){d.msg=signupErrors()[err?.message]||t('Nie udało się zapisać. Spróbuj ponownie.','Could not save. Please try again.')}
 finally{d.busy=false;if($('#signup').open)paintSignup()}
}

async function leaveSignup(id,fromDialog){
 try{
   await rpc('unsignup',{p_event:id});
   mySignupsState='idle';await loadMySignups();syncPublic();
   if(fromDialog&&$('#signup').open)$('#signup').close();
   showToast(t('Wypisano z eventu.','You left the event.'));
 }catch{showToast(t('Nie udało się wypisać. Spróbuj ponownie.','Could not leave. Please try again.'))}
}

function entriesPage(){
 const title=navLabels().entries;
 const head=`<section class="page"><div class="kicker">RWIN Racing</div><h1>${title}</h1>`;
 if(!isDriver())return head+`<p class="panel">${accountUser?t('Zapisy są dostępne dla zweryfikowanych kierowców RWIN.','Entries are available to verified RWIN drivers.'):t('Zaloguj się, aby zobaczyć swoje zapisy.','Sign in to see your entries.')}</p></section>`;
 if(mySignupsState==='idle')queueMicrotask(loadMySignups);
 if(mySignupsState==='error')return head+`<div class="panel"><p>${t('Nie udało się wczytać zapisów.','Could not load your entries.')}</p><button class="btn outline" data-reload-signups>${t('Ponów','Retry')}</button></div></section>`;
 if(!mySignups)return head+`<p class="panel">${t('Wczytywanie…','Loading…')}</p></section>`;
 const rows=[...mySignups.values()].map(r=>({r,e:EVENTS.find(x=>x.id===r.event)})).filter(x=>x.e);
 if(!rows.length)return head+`<div class="panel"><h2>${t('Nie masz jeszcze zapisów','No entries yet')}</h2><p>${t('Otwórz Kalendarz, kliknij wyścig i wybierz „Zapisz się”.','Open the Calendar, pick a race and choose “Sign up”.')}</p><a class="btn" href="#calendar">${icon('cal')}${t('Otwórz kalendarz','Open calendar')}</a></div></section>`;
 return head+rows.map(({r,e})=>{
   const sameMonth=e.start.slice(0,7)===e.end.slice(0,7), days=e.start.slice(-2)+(sameMonth&&e.start!==e.end?'–'+e.end.slice(-2):'');
   return `<article class="racecard entry-card"><div class="date">${days}<small>${fmt(e.start,{month:'short',year:'numeric'}).toUpperCase()}</small></div>
   <div class="raceinfo"><span class="tag">${categories()[e.category]||''}</span><h3>${label(e.name)}</h3><div class="meta">${label(eventTrack(e).name)} · ${escapeHTML(e.duration||'')}</div>
   <div class="entry-pick">${signupSummary(e,r)}</div>${r.notes?`<div class="note">${t('Uwagi','Notes')}: ${escapeHTML(r.notes)}</div>`:''}</div>
   <div class="entry-actions">${e.end>=today()?`<button class="btn outline" data-signup="${escapeHTML(e.id)}">${t('Edytuj','Edit')}</button><button class="smalllink" data-unsign="${escapeHTML(e.id)}">${t('Wypisz się','Leave')}</button>`:`<span class="race-note">${t('Zakończony','Finished')}</span>`}</div></article>`;
 }).join('')+'</section>';
}

 <div class="soon" aria-label="Soon">SOON</div><p class="intro">${t('Planer strategii (stinty, paliwo, zmiany kierowców) pojawi się razem z programem RWIN.','The strategy planner (stints, fuel, driver swaps) is coming with the RWIN app.')}</p></section>`;

// Sektory jak na pomiarze czasu: przejechany = fioletowy. Na końcu światła startowe i logowanie.
const GUIDE_KEY='rwin.guide.v2';
let guideStep=0;
function guideState(){try{const s=JSON.parse(localStorage.getItem(GUIDE_KEY)||'{}');return {max:Number.isInteger(s.max)?s.max:0,finished:!!s.finished}}catch{return {max:0,finished:false}}}
function saveGuide(s){try{localStorage.setItem(GUIDE_KEY,JSON.stringify(s))}catch{}}
const gChecks=items=>`<ul class="gd-checks">${items.map(([a,b])=>`<li><b>${a}</b>${b?`<span>${b}</span>`:''}</li>`).join('')}</ul>`;

 {tag:t('Zasady','Rules'),title:t('Zasady w boksie','Rules of the pit box'),

   <div><h3>${t('Na kanałach głosowych','On voice')}</h3>${gChecks([[t('Push-to-talk lub redukcja szumów','Push-to-talk or noise suppression')],[t('W wyścigu tylko komunikaty z toru','Race calls only during races')],[t('Krótko: kto, gdzie, co','Short: who, where, what')],[t('Bez muzyki w tle','No background music')]])}</div></div>`},

   <label>${t('Odległość oczu (cm)','Eye distance (cm)')}<input type="number" id="fovDist" min="20" max="300" step="1" value="70"></label><output id="fovOut" class="fov-out"></output></div>

function paintGuide(){
 const steps=GUIDE(), s=guideState(), i=Math.min(Math.max(guideStep,0),steps.length-1), cur=steps[i], last=i===steps.length-1;
 const num=String(i+1).padStart(2,'0');
 $('#guideContent').innerHTML=`<div class="gd">
 <div class="gd-main">
  <div class="gd-sectors" role="list" aria-label="${t('Postęp','Progress')}">${steps.map((x,n)=>`<button role="listitem" class="gd-sector${n<i||n<=s.max&&n!==i?' done':''}${n===i?' cur':''}" data-guide-step="${n}" ${n>s.max+1?'disabled':''} aria-label="${t('Sektor','Sector')} ${n+1}: ${x.title}"><i></i><span>S${n+1}</span></button>`).join('')}</div>
  <div class="gd-kicker"><span>${t('Sektor','Sector')} ${i+1} / ${steps.length}</span><span>${cur.tag}</span></div>
  <h2 id="guideTitle" tabindex="-1">${cur.title}</h2>
  <p class="gd-lead">${cur.lead}</p>
  <div class="gd-body">${cur.body()}</div>
  <div class="gd-foot">${i?`<button class="btn outline" data-guide-step="${i-1}">← ${t('Wstecz','Back')}</button>`:'<span></span>'}
   ${last?'':`<div class="gd-foot-r">${s.finished||accountUser?'':`<button class="smalllink" data-guide-step="${steps.length-1}">${t('Pomiń','Skip')}</button>`}<button class="btn" data-guide-step="${i+1}">${t('Dalej','Next')} →</button></div>`}</div>
 </div>
 <div class="gd-poster" aria-hidden="true"><span class="crop"></span><div class="gd-poster-top"><span>RWIN RACING</span><span>${t('PRZEWODNIK','GUIDE')}</span></div>
  <div class="gd-num">${num}</div><svg class="gd-mark"><use href="#rwin-mark"/></svg>
  <div class="gd-poster-bottom"><span class="serial"></span><span>${cur.tag.toUpperCase()}</span><span class="ticks"></span></div></div>
 </div>`;
 $('#guideClose').setAttribute('aria-label',t('Zamknij','Close'));
 updateFov();
}
function guideGo(n){
 const steps=GUIDE().length, s=guideState();
 guideStep=Math.min(Math.max(n,0),steps-1);
 if(guideStep>s.max)s.max=guideStep;
 if(guideStep===steps-1)s.finished=true;
 saveGuide(s);paintGuide();
 const g=$('#guide');g.scrollTop=0;$('#guideTitle')?.focus({preventScroll:true});
}
function openGuide(){
 const s=guideState();
 guideStep=s.finished?GUIDE().length-1:Math.min(s.max,GUIDE().length-1);
 paintGuide();if(!$('#guide').open)$('#guide').showModal();
 $('#guideTitle')?.focus({preventScroll:true});
}
const loginOrGuide=()=>openGuide();
function updateFov(){
 const out=$('#fovOut');if(!out)return;
 const diag=Number($('#fovDiag').value), dist=Number($('#fovDist').value), [w,h]=$('#fovRatio').value.split(':').map(Number);
 if(!(diag>0&&dist>0)){out.textContent='—';return}
 const height=diag*2.54*h/Math.hypot(w,h), fov=2*Math.atan(height/2/dist)*180/Math.PI;
 out.innerHTML=`<span>${t('Pionowe FOV','Vertical FOV')}</span><b>${fov.toFixed(1)}°</b>`;
}
$('#guide').addEventListener('keydown',e=>{
 if(e.target.matches('input,select,textarea'))return;
 if(e.key==='ArrowRight'&&guideStep<GUIDE().length-1&&guideStep<=guideState().max)guideGo(guideStep+1);
 else if(e.key==='ArrowLeft'&&guideStep>0)guideGo(guideStep-1);
});

document.addEventListener('input',e=>{
 if(['fovDiag','fovDist','fovRatio'].includes(e.target.id))updateFov();
 if(e.target.id==='signupNotes'&&signupDraft){signupDraft.notes=e.target.value;$('#notesCount').textContent=e.target.value.length+' / 500'}
});
document.addEventListener('change',e=>{if(e.target.id==='fovRatio')updateFov()});
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.guideStep!==undefined)guideGo(Number(b.dataset.guideStep));
 else if(b.hasAttribute('data-guide-login')){$('#guide').close();startDiscordLogin()}
 else if(b.dataset.signup)openSignup(b.dataset.signup);
 else if(b.dataset.slot&&signupDraft){const s=signupDraft.slots;s.has(b.dataset.slot)?s.delete(b.dataset.slot):s.add(b.dataset.slot);signupDraft.msg='';paintSignup(`[data-slot="${CSS.escape(b.dataset.slot)}"]`)}
 else if(b.dataset.slotDay&&signupDraft){const e2=EVENTS.find(x=>x.id===signupDraft.id), day=(e2.sessions||[]).filter(s=>dateKey(new Date(s))===b.dataset.slotDay), all=day.every(s=>signupDraft.slots.has(s));
   day.forEach(s=>all?signupDraft.slots.delete(s):signupDraft.slots.add(s));signupDraft.msg='';paintSignup(`[data-slot-day="${b.dataset.slotDay}"]`)}
 else if(b.dataset.pickDay&&signupDraft){const s=signupDraft.days;s.has(b.dataset.pickDay)?s.delete(b.dataset.pickDay):s.add(b.dataset.pickDay);signupDraft.msg='';paintSignup(`[data-pick-day="${b.dataset.pickDay}"]`)}
 else if(b.dataset.pickClass&&signupDraft){signupDraft.cls=b.dataset.pickClass;signupDraft.msg='';paintSignup(`[data-pick-class="${b.dataset.pickClass}"]`)}
 else if(b.hasAttribute('data-signup-save'))saveSignup();
 else if(b.hasAttribute('data-signup-leave')&&signupDraft){if(!signupDraft.armed){signupDraft.armed=true;paintSignup('[data-signup-leave]');setTimeout(()=>{if(signupDraft?.armed){signupDraft.armed=false;if($('#signup').open)paintSignup()}},4000)}else leaveSignup(signupDraft.id,true)}
 else if(b.dataset.unsign){if(b.dataset.armed){leaveSignup(b.dataset.unsign)}else{b.dataset.armed='1';b.textContent=t('Na pewno?','Sure?');setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=t('Wypisz się','Leave')}},4000)}}
 else if(b.hasAttribute('data-reload-signups')){mySignupsState='idle';loadMySignups()}
});

$('#logout').onclick = logout;
$('#login').onclick = () => {
  if (!accountUser) return loginOrGuide();
  if (!allowed()) return checkAccess();
  const opening = $('#accountPanel').hidden;
  $('#accountPanel').hidden = !opening;
  $('#login').setAttribute('aria-expanded',String(opening));
  if (opening) $('#logout').focus();
};
document.addEventListener('click',e => { if (!$('#account').contains(e.target)) closeAccount(); });
$('#account').addEventListener('focusout',e => { if (e.relatedTarget && !$('#account').contains(e.relatedTarget)) closeAccount(); });
$('#account').addEventListener('keydown',e => {
  if (e.key === 'Escape' && !$('#accountPanel').hidden) {
    e.stopPropagation(); closeAccount(); $('#login').focus();
  }
});
window.addEventListener('pageshow', e => { if (e.persisted) { authBusy = false; paintAccount(); } });
initializeAuth();
syncPublic();
