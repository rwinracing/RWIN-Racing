<script>



'use strict';

// TERMINARZ. Jeden rekord na wydarzenie. Daty określają dni w Europe/Warsaw.

// category: special | weekly | training. sessions: daty ISO z offsetem lub Z.

// name, track, description: tekst lub obiekt {pl: '...', en: '...'}.

const TRACKS = {

  silverstone: {name:'Silverstone Circuit', photo:'tory/silverstone.jpg', credit:'Ian S · CC BY-SA 2.0', source:'https://www.geograph.org.uk/photo/4595942'},

  monza: {name:'Autodromo Nazionale Monza', photo:'tory/monza.webp'},

  'spa-francorchamps': {name:'Circuit de Spa-Francorchamps', photo:'tory/spa-francorchamps.webp'},

  bahrain: {name:'Bahrain International Circuit', photo:'tory/bahrain.webp'},

  tba: {name:{pl:'Tor do ogłoszenia',en:'Circuit to be announced'}, photo:null}

};

function eventTrack(e){return TRACKS[e.trackId] || {name:e.track || e.trackId, photo:null}}

const official = {

  source: 'https://lemansultimate.com/special-events-calendar-q3-4-2026/',

  publisher: 'Le Mans Ultimate', checked: '2026-11-26', category: 'special',

  sessions: [], description: {pl:'Klasy samochodów: Hypercar i LMGT3.', en:'Car classes: Hypercar and LMGT3.'}

};

const EVENTS = [

  {...official, id:'bahrain-2026', name:'8 Hours Bahrain', trackId:'bahrain',

    start:'2026-11-13', end:'2026-11-15', duration:'8 h'},

  {...official, id:'monza-2026', name:'6 Hours Monza', trackId:'monza',

    start:'2026-11-20', end:'2026-11-22', duration:'6 h'},

  {...official, id:'silverstone-2026', name:'6 Hours Silverstone', trackId:'silverstone',

    start:'2026-12-04', end:'2026-12-06', duration:'6 h'},

  {...official, id:'december-2026', name:{pl:'6 godzin • tor do ogłoszenia',en:'6 Hours • venue TBA'},

    trackId:'tba', start:'2026-12-18', end:'2026-12-20', duration:'6 h',

    description:{pl:'Klasy samochodów: Hypercar, WEC LMP2 i LMGT3.',en:'Car classes: Hypercar, WEC LMP2 and LMGT3.'}}

];

// SKŁAD. Przykładowy format wpisu: {name: 'Imię i nazwisko', avatar: 'assets/avatar.png'}.

const DRIVERS = [];



// LOGOS — opcjonalne ścieżki do oryginalnych plików PNG z przezroczystym tłem.

// Dla grafiki 500 × 500 przycinamy tylko przezroczyste marginesy w SVG.

const LOGOS = { header: '', hero: '', footer: '' };

function applyLogos(){

  const locations = {header: '.bar .identity svg', hero: '.mainmark', footer: '.foot .identity svg'};

  for (const [place, selector] of Object.entries(locations)) {

    const svg = document.querySelector(selector);

    if (!svg || !LOGOS[place]) continue;

    const probe = new Image();

    probe.onload = () => {

      svg.setAttribute('viewBox', '92 165 276 162');

      const image = document.createElementNS('http://www.w3.org/2000/svg', 'image');

      image.setAttribute('href', LOGOS[place]);

      image.setAttribute('width', '500');

      image.setAttribute('height', '500');

      svg.replaceChildren(image);

    };

    probe.src = LOGOS[place];

  }

}

const STORY = {

pl:[

'RWIN Racing to międzynarodowy zespół simracingowy założony w Polsce, którego historia rozpoczęła się na początku stycznia 2026 roku. Wszystko zaczęło się od dwóch przyjaciół, którzy założyli serwer Discord z prostym zamiarem — wspólnie się ścigać, rozwijać swoje umiejętności i czerpać przyjemność z simracingu.',

'Początkowo nie planowaliśmy tworzenia zespołu simracingowego. Z czasem jednak wspólna pasja do wyścigów zaczęła przeradzać się w coś znacznie większego.',

'Na początku września 2026 roku narodziła się oficjalna nazwa RWIN Racing oraz powstało nasze logo. W ciągu zaledwie miesiąca zespół znacząco się rozrósł, a my zdobyliśmy cenne doświadczenie w jego organizacji, prowadzeniu i przygotowywaniu wspólnych startów.',

'Dziś RWIN Racing to przede wszystkim ludzie, których łączy pasja do motorsportu, rywalizacji i ciągłego rozwoju.',

'A to dopiero początek. Historia RWIN Racing pisze się właśnie na Waszych oczach!'

], en:[

'RWIN Racing is an international sim racing team founded in Poland. Our story began in early January 2026, when two friends set up a Discord server with a simple idea in mind — to race together, improve their skills and enjoy sim racing.',

'We had no plans to form a team at first. Over time, though, our shared love of racing grew into something much bigger.',

'In early September 2026, we officially became RWIN Racing and created our logo. In just one month, the team grew considerably, and we gained valuable experience organising the team, running it and preparing for races together.',

'Today, RWIN Racing is first and foremost about the people who share a passion for motorsport, competition and getting better together.',

'And this is only the beginning. The story of RWIN Racing is unfolding right before your eyes!'

]};

const $ = s => document.querySelector(s);

let lang = 'pl';

try { if(localStorage.getItem('rwin.language')==='en') lang='en'; } catch {}

const t=(pl,en)=>lang==='pl'?pl:en;

const local=value=>typeof value==='string'?value:value?.[lang]??'';

const escapeHTML=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const label=value=>escapeHTML(local(value));

const icon=id=>`<svg class="icon" aria-hidden="true"><use href="#${id}"/></svg>`;

const zone='Europe/Warsaw';

const dateKey=date=>new Intl.DateTimeFormat('sv-SE',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit'}).format(date);

const today=()=>dateKey(new Date());

const asDate=key=>new Date(key+'T12:00:00Z');

const locale=()=>t('pl-PL','en-GB');

const fmt=(key,opts)=>new Intl.DateTimeFormat(locale(),{timeZone:zone,...opts}).format(asDate(key));

const full=key=>fmt(key,{day:'numeric',month:'long',year:'numeric'});

function range(e){

  return new Intl.DateTimeFormat(locale(),{timeZone:zone,day:'numeric',month:'long',year:'numeric'}).formatRange(asDate(e.start),asDate(e.end));

}

function sessionTime(iso){

  return new Intl.DateTimeFormat(locale(),{timeZone:zone,hour:'2-digit',minute:'2-digit',hourCycle:'h23',timeZoneName:'shortOffset'}).format(new Date(iso));

}

const navLabels=()=>({home:t('Strona główna','Home'),calendar:t('Kalendarz','Calendar'),entries:t('Moje zapisy','My entries'),strategy:t('Strategia','Strategy'),about:'About us',drivers:t('Kierowcy','Drivers')});

const categories=()=>({all:t('Wszystkie','All'),special:'Special Events',weekly:'Weekly Races',training:t('Treningi zespołu','Team practice')});

let month=today().slice(0,7), filter='all', activeEvent=null, toastTimer;

function page(){const hash=location.hash.slice(1);return Object.hasOwn(navLabels(),hash)?hash:'home'}

function setSub(open){$('#submenu').hidden=!open;$('#subToggle').setAttribute('aria-expanded',String(open))}

function setNav(open){$('#nav').classList.toggle('open',open);$('#hamb').setAttribute('aria-expanded',String(open));if(!open)setSub(false)}

function times(e){return [...e.sessions].sort((a,b)=>Date.parse(a)-Date.parse(b))}

function nextStart(now=Date.now()){

  let result=null;

  for(const event of EVENTS){

    for(const session of event.sessions){

      const at=Date.parse(session);

      if(at>now && (!result || at<result.at)) result={event,session,at};

    }

  }

  return result;

}

function card(e,session){

 const start=session?dateKey(new Date(session)):e.start;

 const sameMonth=start.slice(0,7)===e.end.slice(0,7);

 const days=start.slice(-2)+(sameMonth&&!session&&start!==e.end?'–'+e.end.slice(-2):'');

 return `<article class="racecard"><div class="date">${days}<small>${fmt(start,{month:'short',year:'numeric'}).toUpperCase()}</small></div>

 <div class="raceinfo"><span class="tag">${categories()[e.category]}</span><h3>${label(e.name)}</h3><div class="meta">${label(eventTrack(e).name)} · ${escapeHTML(e.duration)}</div>

 <div class="note">${!sameMonth?range(e)+' · ':''}${session?sessionTime(session):times(e).length?t('Pierwsza sesja','First session')+' · '+full(dateKey(new Date(times(e)[0])))+' · '+sessionTime(times(e)[0]):t('Godziny sesji do potwierdzenia','Session times to be confirmed')}</div></div>

 <button class="btn outline" data-event="${escapeHTML(e.id)}" aria-label="${t('Szczegóły','Details')} · ${label(e.name)}">${t('Szczegóły','Details')} <span aria-hidden="true">↗</span></button></article>`;

}

function home(){

 return `<section class="mast"><div><div class="kicker">Le Mans Ultimate</div><h1><em>RWIN</em> Endurance<br>Racing Team</h1></div><div>

 <p>${t('Międzynarodowy zespół simracingowy założony w Polsce. Razem ścigamy się w wyścigach długodystansowych w Le Mans Ultimate.','An international sim racing team founded in Poland. We race together in endurance events in Le Mans Ultimate.')}</p>

 <a class="smalllink" href="#about">${t('Poznaj zespół','Meet the team')} ↗</a></div></section><section class="event-block" id="nextEvent" aria-labelledby="nextHeading"></section>`;

}

let nextTimer;

function renderNext(){

 clearTimeout(nextTimer);

 const block=$('#nextEvent');

 if(!block)return;

 const next=nextStart();

 const track=next?eventTrack(next.event):TRACKS.silverstone;

 const name=label(track.name);

 block.innerHTML=`<div class="event-copy"><div class="kicker">${t('Następny event','Next event')}</div>

 <h2 id="nextHeading">${next?label(next.event.name):t('Czekamy na kolejny termin','Waiting for the next start')}</h2>

 ${next?`<div class="meta">${name} · ${categories()[next.event.category]}</div><time class="session-date" datetime="${escapeHTML(next.session)}">${full(dateKey(new Date(next.at)))} · <strong>${sessionTime(next.session)}</strong></time>

 <button class="btn" data-event="${escapeHTML(next.event.id)}">${t('Szczegóły','Details')} ↗</button> <a class="smalllink" href="#calendar">${t('Kalendarz','Calendar')} →</a>`:

 `<a class="btn" href="#calendar">${icon('cal')}${t('Otwórz kalendarz','Open calendar')}</a>`}</div>

 <figure class="event-photo is-fallback"><figcaption>${name}</figcaption></figure>`;

 const figure=block.querySelector('figure');

 if(track.photo){

   const img=new Image(); img.alt=local(track.name);

   img.onload=()=>{

     figure.classList.remove('is-fallback');figure.prepend(img);

     if(track.credit)figure.querySelector('figcaption').innerHTML+=` · <a href="${escapeHTML(track.source)}">${escapeHTML(track.credit)}</a>`;

   };

   img.src=track.photo;

 }

 if(next)nextTimer=setTimeout(renderNext,Math.min(next.at-Date.now(),2147483647));

}

function calendar(){

 const first=asDate(month+'-01');

 const offset=(first.getUTCDay()+6)%7;

 const last=new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth()+1,0)).getUTCDate();

 const all=EVENTS.filter(e=>e.start<=month+'-'+last&&e.end>=month+'-01').sort((a,b)=>a.start.localeCompare(b.start));

 const shown=all.filter(e=>filter==='all'||filter===e.category);

 const weekdays=Array.from({length:7},(_,i)=>`<div class="weekday">${fmt('2026-11-'+(16+i),{weekday:'short'})}</div>`).join('');

 let cells='<div class="blank"></div>'.repeat(offset);

 for(let day=1;day<=last;day++){

   const key=month+'-'+String(day).padStart(2,'0');

   const marks=shown.filter(e=>e.start<=key&&e.end>=key).map(e=>`<button data-event="${escapeHTML(e.id)}" aria-label="${label(e.name)} · ${full(key)}">${label(e.name)}</button>`).join('');

   cells+=`<div class="day ${key===today()?'today':''}"><span class="num" ${key===today()?'aria-current="date"':''}>${day}</span>${marks}</div>`;

 }

 cells+='<div class="blank"></div>'.repeat((7-(offset+last)%7)%7);

 return `<section class="page"><div class="kicker">Le Mans Ultimate</div><h1>${t('Kalendarz wyścigów','Race calendar')}</h1>

 <div class="tools"><h2>${fmt(month+'-01',{month:'long',year:'numeric'})}</h2><button data-month="-1" aria-label="${t('Poprzedni miesiąc','Previous month')}">←</button><button data-month="0">${t('Dzisiaj','Today')}</button><button data-month="1" aria-label="${t('Następny miesiąc','Next month')}">→</button></div>

 <div class="chips">${Object.entries(categories()).map(([k,v])=>`<button aria-pressed="${filter===k}" data-filter="${k}">${v}</button>`).join('')}</div>

 <div class="grid">${weekdays+cells}</div><h2 class="calList">${t('Wyścigi w tym miesiącu','This month’s races')}</h2>

 ${shown.length?shown.map(e=>card(e)).join(''):`<p class="panel">${all.length?t('Brak wydarzeń w wybranej kategorii.','No events in this category.'):t('Brak potwierdzonych wydarzeń w tym miesiącu','No confirmed events this month')}</p>`}

 <p class="note">${t('Terminarz aktualizowany ręcznie. Źródło i datę sprawdzenia znajdziesz w szczegółach wydarzenia.','Manually updated schedule. Each event includes its source and verification date.')}</p></section>`;

}

let rosterQuery='';

function fold(value){return value.toLowerCase().replace(/ł/g,'l').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()}

function rosterResults(){

 const query=fold(rosterQuery);

 const matches=DRIVERS.filter(d=>fold([d.name,d.firstName,d.lastName,d.nick,d.nickname].filter(Boolean).join(' ')).includes(query));

 if(!matches.length)return `<p class="panel">${DRIVERS.length?t('Nie znaleziono kierowcy','No drivers found'):t('Skład zespołu pojawi się tutaj','The team roster will appear here.')}</p>`;

 return `<div class="roster">${matches.map(d=>{

   const name=d.name||[d.firstName,d.lastName].filter(Boolean).join(' ')||d.nick||d.nickname;

   return `<article class="panel">${d.avatar?`<img src="${escapeHTML(d.avatar)}" alt="">`:`<span class="avatar">${escapeHTML(name.charAt(0))}</span>`}<h3>${escapeHTML(name)}</h3></article>`;

 }).join('')}</div>`;

}

function rosterPage(){

 const hint=t('Szukaj kierowcy…','Search drivers…');

 return `<section class="page"><div class="kicker">RWIN Racing</div><div class="roster-heading"><h1>TEAM ROSTER.</h1>

 <div class="searchbox">${icon('search')}<input type="search" id="driverSearch" aria-label="${hint}" placeholder="${hint}" value="${escapeHTML(rosterQuery)}"><button id="clearSearch" aria-label="${t('Wyczyść wyszukiwanie','Clear search')}" ${rosterQuery?'':'hidden'}>×</button></div></div>

 <div id="driverResults" aria-live="polite">${rosterResults()}</div></section>`;

}

function filterRoster(value){

 rosterQuery=value;$('#driverResults').innerHTML=rosterResults();$('#clearSearch').hidden=!value;

}

document.addEventListener('input',e=>{if(e.target.id==='driverSearch')filterRoster(e.target.value)});

document.addEventListener('click',e=>{

 if(e.target.closest('#clearSearch')){const input=$('#driverSearch');input.value='';filterRoster('');input.focus()}

});

function secondary(p){

 const names=navLabels();

 let title=names[p], content='';

 if(p==='about'){

   title=t('KIM JESTEŚMY?','WHO ARE WE?');

   content=`<article class="story">${STORY[lang].map(x=>'<p>'+x+'</p>').join('')}<a class="btn outline" href="#drivers">${names.drivers} →</a></article>`;

 }else if(p==='drivers'){

   return rosterPage();

 }else if(p==='entries'){

   content=accountUser

     ? `<div class="panel"><h2>${t('Moje zapisy','My entries')}</h2><p>${t('Moduł zapisów jest w przygotowaniu.','Event registration is in development.')}</p></div>`

     : `<div class="panel"><h2>${t('Zaloguj się, aby zobaczyć zapisy','Signed out')}</h2><p>${t('Tutaj pojawią się Twoje zgłoszenia do wyścigów.','Your race entries will appear here.')}</p><button class="login" data-login>${icon('discord')}${loginText()}</button></div>`;

 }else{

   content=`<div class="panel"><h2>${t('Plan wyścigu','Race plan')}</h2><p>${t('Tutaj zaplanujesz długość stintów, ilość paliwa i kolejność zmian kierowców.','Plan stint lengths, fuel loads and driver changes here.')}</p><span class="tag">${t('Moduł w przygotowaniu','Coming soon')}</span></div>`;

 }

 return `<section class="page"><div class="kicker">RWIN Racing</div><h1>${title}</h1>${content}</section>`;

}

function showDetails(id){

 const e=EVENTS.find(item=>item.id===id);

 if(!e)return;

 activeEvent=id;

 const track=eventTrack(e), slots=times(e), days=[];

 for(let day=asDate(e.start);day<=asDate(e.end);day.setUTCDate(day.getUTCDate()+1)){

   days.push(fmt(day.toISOString().slice(0,10),{weekday:'long',day:'numeric',month:'short'}));

 }

 const field=(title,value)=>`<div><dt>${title}</dt><dd>${value}</dd></div>`;

 const list=items=>`<ul>${items.map(item=>`<li>${escapeHTML(item)}</li>`).join('')}</ul>`;

 $('#detailBody').innerHTML=`<div class="race-head"><small>RWIN Racing / ${t('Szczegóły wydarzenia','Event details')}</small><h2 id="dialogTitle">${label(e.name)}</h2></div>

 <div class="race-content"><span class="tag">${categories()[e.category]}</span><div class="race-layout">

 <figure class="race-box race-map"><h3>01 / ${t('Mapa toru','Circuit map')}</h3><div class="race-map-frame"><span>${t('Mapa toru wkrótce','Circuit map coming soon')}</span></div><figcaption>${label(track.name)}${e.trackId==='silverstone'?' · DLC':''}</figcaption></figure>

 <div class="race-side"><section class="race-box"><h3>02 / ${t('Informacje o wyścigu','Race information')}</h3><dl class="race-facts">

 ${field(t('Tor','Circuit'),label(track.name))}${field(t('Długość wyścigu','Race duration'),escapeHTML(e.duration))}

 ${field(t('Termin weekendu','Race weekend'),range(e))}${field(t('Godziny startów','Start times'),slots.length?list(slots.map(s=>fmt(dateKey(new Date(s)),{day:'numeric',month:'short'})+' · '+sessionTime(s))):t('Do potwierdzenia','To be confirmed'))}

 ${field(t('Dni wyścigu','Race days'),list(days))}</dl><p class="race-note">${label(e.description)}</p></section>

 <section class="race-box"><h3>03 / ${t('Pogoda i warunki','Weather and conditions')}</h3><p class="race-note">${label(e.weather)||t('Brak aktualnych danych o pogodzie','No current weather data')}</p></section></div></div>

 <div class="race-footer"><a class="btn" href="#entries">${t('Zapisz się','Sign up')} ↗</a><p class="race-note">${t('Sprawdzono','Verified')} ${full(e.checked)} · <a href="${escapeHTML(e.source)}" target="_blank" rel="noopener noreferrer">${escapeHTML(e.publisher)} ↗</a></p></div></div>`;

 if(e.trackId && e.trackId!=='tba'){

   const frame=$('.race-map-frame'), img=new Image();

   img.alt=t('Nitka toru ','Circuit layout · ')+local(track.name);

   img.onload=()=>frame.replaceChildren(img);

   img.src='circut/'+encodeURIComponent(e.trackId)+'.png';

 }

 $('.close').setAttribute('aria-label',t('Zamknij','Close'));

 if(!$('#detail').open)$('#detail').showModal();

}

const loginText=()=>t('Zaloguj przez Discord','Sign in with Discord');

function render(){

 const p=page(),names=navLabels();document.documentElement.lang=lang;

 document.title=names[p]+' | RWIN Endurance Racing Team';

 $('#skip').textContent=t('Przejdź do treści','Skip to content');

 $('#nav').setAttribute('aria-label',t('Nawigacja główna','Main navigation'));

 $('#hamb').setAttribute('aria-label',t('Menu główne','Main menu'));$('#subToggle').setAttribute('aria-label',t('Podmenu zespołu','Team submenu'));

 paintAccount();

 for(const a of document.querySelectorAll('nav a')){

   const key=a.hash.slice(1);a.textContent=names[key];if(p===key)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');

 }

 for(const b of document.querySelectorAll('[data-lang]'))b.setAttribute('aria-pressed',String(b.dataset.lang===lang));

 $('#main').innerHTML=p==='home'?home():p==='calendar'?calendar():secondary(p);

 renderNext();

 applyLogos();

 if(authNotice)$('#toast').textContent=t(...notices[authNotice]);

 if($('#detail').open)showDetails(activeEvent);

}

document.addEventListener('click',event=>{

 const b=event.target.closest('button');if(!b)return;

 if(b.dataset.lang){lang=b.dataset.lang;try{localStorage.setItem('rwin.language',lang)}catch{}render()}

 else if(b.hasAttribute('data-month')){

   const delta=Number(b.dataset.month),d=asDate(month+'-01');d.setUTCMonth(d.getUTCMonth()+delta);

   month=delta?d.toISOString().slice(0,7):today().slice(0,7);render();document.querySelector(`[data-month="${delta}"]`).focus();

 }else if(b.dataset.filter){filter=b.dataset.filter;render();document.querySelector(`[data-filter="${filter}"]`).focus()}

 else if(b.dataset.event)showDetails(b.dataset.event);

 else if(b.hasAttribute('data-login'))startDiscordLogin();

});

$('#hamb').onclick=()=>setNav(!$('#nav').classList.contains('open'));

$('#subToggle').onclick=()=>setSub($('#submenu').hidden);

const group=$('.aboutgroup');

group.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'&&matchMedia('(min-width:821px)').matches)setSub(true)});

group.addEventListener('pointerleave',()=>{if(!group.contains(document.activeElement))setSub(false)});

group.addEventListener('focusout',e=>{if(!group.contains(e.relatedTarget))setSub(false)});

document.addEventListener('click',e=>{if(!group.contains(e.target))setSub(false);if(e.target.closest('nav a'))setNav(false)});

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#detail').open){if(!$('#submenu').hidden){setSub(false);$('#subToggle').focus()}else if($('#nav').classList.contains('open')){setNav(false);$('#hamb').focus()}}});

$('#skip').onclick=e=>{e.preventDefault();$('#main').focus()};

$('.close').onclick=()=>$('#detail').close();

$('#detail').addEventListener('close',()=>activeEvent=null);

</script><script>
// One client owns the PKCE verifier, persisted session and token refresh.
let authClient, clientPromise, accountUser, authNotice, authBusy = false;
const returnKey = 'rwin.return.' + new URL('.', location.href).pathname;
const notices = {
  config: ['Logowanie czeka na konfigurację strony.', 'Sign-in is awaiting site configuration.'],
  cancelled: ['Anulowano logowanie. Możesz spróbować ponownie.', 'Sign-in cancelled. You can try again.'],
  failed: ['Nie udało się zalogować. Spróbuj ponownie.', 'Sign-in failed. Please try again.'],
  logout: ['Nie udało się wylogować. Spróbuj ponownie.', 'Sign-out failed. Please try again.']
};
function notifyAuth(key) {
  authNotice = key;
  const box = $('#toast');
  box.textContent = t(...notices[key]);
  box.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { authNotice = null; box.hidden = true; }, 7000);
}
function configured() {
  return /^https:\/\/[^/\s]+\/?$/.test(SUPABASE_URL) && SUPABASE_PUBLISHABLE_KEY.startsWith('sb_publishable_');
}
function loadSDK() {
  if (window.supabase?.createClient) return Promise.resolve(window.supabase);
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js';
    script.onload = () => window.supabase?.createClient ? resolve(window.supabase) : reject(new Error('SDK'));
    script.onerror = () => { script.remove(); reject(new Error('SDK')); };
    document.head.append(script);
  });
}
function client() {
  if (!clientPromise) clientPromise = loadSDK().then(sdk => {
    authClient = sdk.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {auth:{
      flowType:'pkce', persistSession:true, autoRefreshToken:true, detectSessionInUrl:false
    }});
    authClient.auth.onAuthStateChange((event, session) => applyUser(session?.user));
    return authClient;
  }).catch(error => { clientPromise = null; throw error; });
  return clientPromise;
}
function discordProfile(user) {
  const identity = user.identities?.find(item => item.provider === 'discord')?.identity_data || {};
  const meta = {...user.user_metadata, ...identity};
  const name = meta.global_name || meta.full_name || meta.user_name || meta.preferred_username || meta.name || t('Użytkownik','User');
  const photo = meta.avatar_url || meta.picture || '';
  return {name, photo: /^https:\/\//i.test(photo) && !/\/embed\/avatars\//i.test(photo) ? photo : ''};
}
function closeAccount() {
  $('#accountPanel').hidden = true;
  if (accountUser) $('#login').setAttribute('aria-expanded','false');
}
function paintAccount() {
  const button = $('#login');
  button.disabled = authBusy;
  $('#logout').disabled = authBusy;
  button.className = accountUser ? 'account-avatar' : 'login';
  if (!accountUser) {
    closeAccount();
    button.removeAttribute('aria-expanded');
    button.removeAttribute('aria-controls');
    button.setAttribute('aria-label',loginText());
    button.innerHTML = icon('discord') + '<span></span>';
    button.lastElementChild.textContent = loginText();
    return;
  }
  const {name, photo} = discordProfile(accountUser);
  button.setAttribute('aria-label',t('Menu konta','Account menu')+' · '+name);
  button.setAttribute('aria-expanded',String(!$('#accountPanel').hidden));
  button.setAttribute('aria-controls','accountPanel');
  $('#accountName').textContent = name;
  $('#logout').textContent = t('Wyloguj','Sign out');
  const initial = Array.from(name.trim())[0]?.toLocaleUpperCase() || '?';
  button.textContent = initial;
  if (photo) {
    const img = new Image();
    img.alt = '';
    img.onerror = () => img.remove();
    img.src = photo;
    button.append(img);
  }
}
function applyUser(user) {
  const changed = accountUser?.id !== user?.id;
  accountUser = user;
  if (changed) closeAccount();
  paintAccount();
  if (changed && page() === 'entries') $('#main').innerHTML = secondary('entries');
}
async function startDiscordLogin() {
  if (authBusy) return;
  if (!configured()) return notifyAuth('config');
  authBusy = true;
  paintAccount();
  try {
    sessionStorage.setItem(returnKey,page());
    const sdk = await client();
    const {error} = await sdk.auth.signInWithOAuth({provider:'discord',options:{
      redirectTo:new URL('.',location.href).href, scopes:'identify email'
    }});
    if (error) throw error;
  } catch {
    notifyAuth('failed');
  } finally {
    authBusy = false;
    paintAccount();
  }
}
async function logout() {
  if (authBusy) return;
  authBusy = true;
  paintAccount();
  try {
    const {error} = await authClient.auth.signOut({scope:'local'});
    if (error) throw error;
    applyUser(null);
  } catch {
    notifyAuth('logout');
  } finally {
    authBusy = false;
    closeAccount();
    paintAccount();
    $('#login').focus();
  }
}
async function initializeAuth() {
  const url = new URL(location.href);
  const fragment = new URLSearchParams(url.hash.slice(1));
  const code = url.searchParams.get('code');
  const error = url.searchParams.get('error') || fragment.get('error');
  const detail = url.searchParams.get('error_description') || fragment.get('error_description') || '';
  if (code || error) {
    let route;
    try { route = sessionStorage.getItem(returnKey); sessionStorage.removeItem(returnKey); } catch {}
    for (const key of ['code','error','error_code','error_description']) url.searchParams.delete(key);
    url.hash = Object.hasOwn(navLabels(),route) ? route : '';
    history.replaceState(null,'',url);
  }
  authBusy = configured();
  render();
  if (error) notifyAuth(/access_denied|denied|cancel/i.test(error+' '+detail) ? 'cancelled' : 'failed');
  if (!configured()) { if (code) notifyAuth('config'); return; }
  try {
    const sdk = await client();
    const result = code && !error ? await sdk.auth.exchangeCodeForSession(code) : await sdk.auth.getSession();
    if (result.error) throw result.error;
    applyUser(result.data.session?.user);
  } catch {
    notifyAuth('failed');
  } finally {
    authBusy = false;
    paintAccount();
  }
}
$('#logout').onclick = logout;
$('#login').onclick = () => {
  if (!accountUser) return startDiscordLogin();
  const opening = $('#accountPanel').hidden;
  $('#accountPanel').hidden = !opening;
  $('#login').setAttribute('aria-expanded',String(opening));
  if (opening) $('#logout').focus();
};
document.addEventListener('click',e => { if (!$('#account').contains(e.target)) closeAccount(); });
$('#account').addEventListener('focusout',e => { if (e.relatedTarget && !$('#account').contains(e.relatedTarget)) closeAccount(); });
$('#account').addEventListener('keydown',e => {
  if (e.key === 'Escape' && !$('#accountPanel').hidden) {
    e.stopPropagation(); closeAccount(); $('#login').focus();
  }
});
window.addEventListener('pageshow', e => { if (e.persisted) { authBusy = false; paintAccount(); } });
initializeAuth();

</script></body></html>
